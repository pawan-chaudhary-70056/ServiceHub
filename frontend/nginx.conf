# Static delivery for the SPA, with the SPA fallback and the security headers docs/17
# requires at the edge: CSP, HSTS, nosniff, framing denial and a referrer policy.
#
# nginx inheritance caveat: an `add_header` inside a `location` REPLACES the ones
# inherited from the server block rather than adding to them. Every location that
# declares its own header therefore repeats the security set — a location that only sets
# Cache-Control would otherwise silently ship without CSP.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # docs/17 §5: default-src 'self', no unsafe-inline for scripts, connect-src limited to
  # the app's own origin (the API is same-origin), no third-party script inclusion.
  # frame-ancestors supersedes X-Frame-Options for modern agents; both are sent.
  set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

  # docs/17 §5: force HTTPS for a year, include subdomains. Sent unconditionally so it
  # takes effect the moment TLS terminates in front of this server.
  set $hsts "max-age=31536000; includeSubDomains";

  add_header Content-Security-Policy $csp always;
  add_header Strict-Transport-Security $hsts always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;

  # SPA routing: unknown paths resolve to the app shell, not a 404 (docs/14).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  # index.html must never be cached, or clients pin a stale app version.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
