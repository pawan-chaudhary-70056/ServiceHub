# Static delivery for the SPA, with the SPA fallback and baseline security headers
# (docs/17). Headers that require origin knowledge (CSP with nonces) are set at the
# edge/load balancer in production.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing: unknown paths resolve to the app shell, not a 404 (docs/14).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or clients pin a stale app version.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
