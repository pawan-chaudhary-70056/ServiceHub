# CI pipeline — implements the stages defined in docs/35-DEPLOYMENT-AND-CI-CD.md §4.
#
# Every gate here is mandatory for main-branch merges: lint, typecheck, tests, build,
# security scans and the migration check. A skipped step is a false claim of safety.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: servicehub
          POSTGRES_PASSWORD: servicehub
          POSTGRES_DB: servicehub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U servicehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://servicehub:servicehub@localhost:5432/servicehub_test?schema=public
      REDIS_URL: redis://localhost:6379
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prisma:generate
      - name: Migration check (applies cleanly on a scratch database)
        run: npm run prisma:migrate:deploy
      - run: npm test
      - run: npm run build

      # Blocks high/critical findings. A time-boxed exception must be explicit.
      - name: Dependency audit
        run: npm audit --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

            # Required gate: audit production dependencies.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      # TEMPORARY EXCEPTION — review by 2026-10-30.
      # Full audit currently reports development/build dependency findings
      # involving braces and postcss-selector-parser in Tailwind CSS 3.
      # Keep this visible while a verified remediation is evaluated.
      # Do not treat this as a clean full dependency audit.
      - name: Full dependency audit (temporary exception)
        run: npm audit --audit-level=high
        continue-on-error: true

  iac-scan:
    name: IaC and container scan
    runs-on: ubuntu-latest
    # docs/20 §2: image and configuration misconfiguration, on every build. Trivy reads
    # the Dockerfiles and compose file as written, so a relaxed flag or a root runtime is
    # caught here rather than in production.
    steps:
      - uses: actions/checkout@v4

      - name: Scan IaC configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Backstop only. The control is that secrets are never committed.
      #
      # Two passes, because one pattern cannot serve both jobs. Pass 1 matches a
      # secret-shaped name assigned any 16-character value, and runs over source and
      # configuration — every test file is excluded, because `const ADMIN_PASSWORD =
      # 'Secur3-Passphrase!'` is a fixture and not a credential: it was failing this job on
      # 13 files, and a gate that cries wolf is a gate people learn to skip (docs/20 §3).
      # Pass 2 covers everything, tests included, but only for values with a real provider's
      # shape — so a live key accidentally pasted into a fixture is still caught.
      - name: Scan for committed credentials (source and configuration)
        run: |
          if git grep -nEI '(SECRET|PASSWORD|TOKEN|API_KEY)[[:space:]]*[:=][[:space:]]*["'\'']?[A-Za-z0-9/_+-]{16,}' \
             -- ':!*.example' ':!*.md' ':!docs/*' ':!package-lock.json' \
                ':!**/tests/**' ':!**/*.test.ts' ':!**/*.test.tsx'; then
            echo "::error::Possible committed secret detected."
            exit 1
          fi

      # Credential shapes, not just credential-shaped names: a private key block, an AWS
      # access key id, a Stripe/SendGrid/webhook signing secret. Applied to every file,
      # so no directory is a blind spot.
      - name: Scan for provider credential shapes (all files)
        run: |
          if git grep -nEI '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(sk|pk)_(live|test)_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}|SG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' \
             -- ':!*.example' ':!*.md' ':!docs/*' ':!package-lock.json'; then
            echo "::error::A provider credential shape was committed."
            exit 1
          fi
